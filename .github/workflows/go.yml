name: Go
on: [push]
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Swagger - Installation
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Swagger - Init
        run: ~/go/bin/swag init

      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi

      - name: Config
        run: |
          cp config.json.dist config.json
          sed -i 's/pk_xxx/${{ secrets.STRIPE_PK }}/g; s/sk_xxx/${{ secrets.STRIPE_SK }}/g' config.json

      - name: Build
        run: go build -v .

      - name: Guard - no legacy stripe resource APIs
        run: |
          set -e
          if grep -R --include='*.go' -n 'stripe\.Key\s*=' . --exclude-dir=vendor; then
            echo "stripe.Key assignment is forbidden; use appconfig.ClientForCurrency / stripe.NewClient"
            exit 1
          fi
          if grep -R --include='*.go' -nE 'github.com/stripe/stripe-go/v82/(paymentintent|customer)"' . --exclude-dir=vendor; then
            echo "legacy paymentintent/customer packages must not be imported; use stripe.Client services"
            exit 1
          fi

      - name: Tests - Unit
        run: go test ./... -failfast -tags=unit

      - name: Tests - Stripe
        run: go test ./... -failfast -tags=stripe -config=/home/runner/work/upaygo/upaygo/config.json
